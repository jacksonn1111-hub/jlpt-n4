<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JLPT N4 단어장 1500</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0f172a;--card:#1e293b;--card2:#334155;--accent:#3b82f6;--accent2:#60a5fa;
--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316;--purple:#a855f7;
--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--border:#475569;--radius:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:500px;margin:0 auto;padding:12px 12px 100px}
.hdr{text-align:center;padding:20px 0 16px}
.hdr h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr p{font-size:13px;color:var(--text2);margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--card);border-radius:var(--radius);padding:4px}
.tab{flex:1;padding:10px 0;text-align:center;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;color:var(--text2)}
.tab.on{background:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);padding:12px 8px;text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--accent2)}
.stat .l{font-size:11px;color:var(--text2);margin-top:2px}
.pbar{background:var(--card);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
.pbar .row{display:flex;justify-content:space-between;margin-bottom:6px}
.pbar .row span{font-size:13px;color:var(--text2)}
.pbar .row b{font-size:13px;color:var(--accent2)}
.pbar .track{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.pbar .fill{height:100%;border-radius:4px;transition:width .5s}
.catWrap{margin-bottom:14px}
.catWrap label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
.catSel{width:100%;padding:10px 14px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:14px;appearance:none;-webkit-appearance:none}
.wcard{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:12px;position:relative;border:1px solid transparent;transition:.3s}
.wcard.learned{border-color:var(--green)}
.wnum{position:absolute;top:12px;right:14px;font-size:12px;color:var(--text3);font-weight:600}
.wword{font-size:28px;font-weight:800;margin-bottom:4px}
.whira{font-size:16px;color:var(--accent2);margin-bottom:2px}
.wpron{font-size:14px;color:var(--text2);margin-bottom:6px}
.wmean{font-size:18px;font-weight:700;color:var(--green);margin-bottom:12px}
.wex{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:8px}
.wex .jp{font-size:15px;margin-bottom:3px}
.wex .pr{font-size:13px;color:var(--text2);margin-bottom:3px}
.wex .kr{font-size:14px;color:var(--yellow)}
.reveal{display:none}
.showAll .reveal{display:block}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.success{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.full{width:100%;padding:14px}
.btn.purple{background:var(--purple);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
/* 퀴즈 */
.qcard{background:var(--card);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:14px}
.qcard .qword{font-size:32px;font-weight:800;margin-bottom:4px}
.qcard .qsub{font-size:14px;color:var(--text2)}
.qcard .qscore{font-size:13px;color:var(--text3);margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.opt{padding:14px 12px;background:var(--card);border:2px solid var(--border);border-radius:12px;font-size:15px;text-align:center;cursor:pointer;transition:.2s;font-weight:600}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:var(--green);background:rgba(16,185,129,.15);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.15);color:var(--red)}
/* 퀴즈 모드 선택 */
.qmodes{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.qmode{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.2s}
.qmode:active{transform:scale(.98)}
.qmode h3{font-size:16px;margin-bottom:4px}
.qmode p{font-size:13px;color:var(--text2)}
.qmode.sel{border-color:var(--accent)}
/* 목록 */
.wlist{margin-bottom:14px}
.witem{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.2s}
.witem:active{background:var(--card2)}
.witem .wn{font-size:12px;color:var(--text3);width:32px;text-align:right;flex-shrink:0}
.witem .ww{font-size:16px;font-weight:700;flex:1}
.witem .wm{font-size:13px;color:var(--text2);flex:1;text-align:right}
.witem.done{opacity:.5}
.witem .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.witem.done .check{background:var(--green);border-color:var(--green);color:#fff}
.search{width:100%;padding:12px 16px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;font-size:15px;margin-bottom:12px}
.search::placeholder{color:var(--text3)}
/* 체크리스트 */
.clGroup{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.clGroup h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.clGroup h3 span{font-size:12px;color:var(--text3);font-weight:400}
.clItem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--card2)}
.clItem:last-child{border-bottom:none}
.clBox{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:.2s}
.clBox.checked{background:var(--green);border-color:var(--green);color:#fff}
.clLabel{font-size:14px;flex:1}
.clLabel.checked{text-decoration:line-through;color:var(--text3)}
.clRange{font-size:12px;color:var(--text3);flex-shrink:0}
.clPbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:8px}
.clPbar .f{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .3s}
/* 네비 */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;transition:.2s}
.navBtn.on{color:var(--accent2)}
.navBtn svg{width:22px;height:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .inner{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto}
.hide{display:none!important}
.loadMore{text-align:center;padding:14px}
.loadMore button{background:var(--card2);color:var(--text2);border:none;padding:10px 24px;border-radius:10px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav">
<div class="navBtn on" data-p="home" onclick="go('home')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
<span>홈</span>
</div>
<div class="navBtn" data-p="study" onclick="go('study')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
<span>학습</span>
</div>
<div class="navBtn" data-p="quiz" onclick="go('quiz')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
<span>퀴즈</span>
</div>
<div class="navBtn" data-p="check" onclick="go('check')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
<span>체크</span>
</div>
<div class="navBtn" data-p="list" onclick="go('list')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
<span>목록</span>
</div>
</nav>

let page='home',catFilter=0,studyIdx=0,showAnswer=false;
let qMode=null,quizQ=null,quizPicked=null,qScore=0,qTotal=0;
let listSearch='',listLimit=50;

function getCat(no){let c='';for(let i=CATS.length-1;i>=0;i--){if(no>=CATS[i][0]){c=CATS[i][1];break}}return c}
function filtered(){
if(catFilter===0)return W;
let ci=CATS.findIndex(c=>c[0]===catFilter);
let end=ci<CATS.length-1?CATS[ci+1][0]:401;
return W.filter(w=>w[0]>=catFilter&&w[0]<end);
}
function go(p){page=p;showAnswer=false;if(p==='quiz'){qMode=null;qScore=0;qTotal=0;quizQ=null;quizPicked=null}if(p==='list')listLimit=50;
document.querySelectorAll('.navBtn').forEach(b=>{b.classList.toggle('on',b.dataset.p===p)});render();window.scrollTo(0,0)}
function render(){const a=document.getElementById('app');
if(page==='home')renderHome(a);else if(page==='study')renderStudy(a);
else if(page==='quiz')renderQuiz(a);else if(page==='check')renderCheck(a);
else if(page==='list')renderList(a)}

let total=400,done=0;for(let i=1;i<=400;i++)if(learned.has(i))done++;
let pct=Math.round(done/total*100);

a.innerHTML=`
<div class="hdr"><h1>🇯🇵 JLPT N4 단어장</h1><p>1500개 완전정복 · 예문+발음+뜻</p></div>
<div class="stats">
<div class="stat"><div class="n">1500</div><div class="l">전체 단어</div></div>
<div class="stat"><div class="n" style="color:var(--green)">${done}/400</div><div class="l">고유 단어 학습</div></div>
<div class="stat"><div class="n" style="color:var(--yellow)">${today}</div><div class="l">오늘 학습</div></div>
</div>
<div class="pbar">

</div>

<button class="btn purple full" onclick="go('quiz')" style="margin-bottom:8px">🧠 퀴즈 도전</button>
<button class="btn orange full" onclick="go('check')" style="margin-bottom:8px">✅ 체크리스트</button>
<button class="btn ghost full" onclick="go('list')" style="margin-bottom:8px">📋 전체 목록</button>
<button class="btn ghost full" onclick="resetAll()" style="font-size:12px;opacity:.5">🔄 전체 초기화</button>`}

let fw=filtered();if(!fw.length){a.innerHTML='<p style="text-align:center;padding:40px;color:var(--text2)">단어가 없습니다.</p>';return}
if(studyIdx>=fw.length)studyIdx=0;let w=fw[studyIdx];let isL=learned.has(w[0]);

</select></div>

<div class="whira">${w[2]}</div>
<div class="wpron">${w[3]}</div>
<div class="reveal"><div class="wmean">${w[4]}</div>
<div class="wex"><div class="jp">${w[5]}</div><div class="pr">${w[6]}</div><div class="kr">${w[7]}</div></div></div>
${showAnswer?'':'<button class="btn primary full" onclick="showAnswer=true;render()">뜻 보기</button>'}
</div>
${showAnswer?'<div class="btns"><button class="btn danger" onclick="markNext(0)">모르겠어요 😓</button><button class="btn success" onclick="markNext(1)">알겠어요! ✅</button></div>':''}
<div class="btns" style="margin-top:8px">
<button class="btn ghost" onclick="studyIdx=Math.max(0,studyIdx-1);showAnswer=false;render()">⬅ 이전</button>

if(ok){learned.add(w[0]);let tk='jn4_today_'+new Date().toDateString();localStorage.setItem(tk,''+(parseInt(localStorage.getItem(tk)||'0')+1))}
else learned.delete(w[0]);saveLearned();studyIdx++;showAnswer=false;render()}

function renderQuiz(a){
if(!qMode){
a.innerHTML=`
<div class="hdr"><h1>🧠 퀴즈</h1><p>모드를 선택하세요</p></div>
<div class="catWrap"><label>카테고리</label>
<select class="catSel" onchange="catFilter=+this.value">
<option value="0">전체 (1500개)</option>

<div class="qmode" onclick="startQuiz('kr2jp')"><h3>🇰🇷 → 🇯🇵 한국어→일본어</h3><p>한국어 뜻을 보고 일본어 맞추기</p></div>
</div>`;return}
if(!quizQ)newQuiz();let q=quizQ;
let questionText,questionSub;
if(qMode==='jp2kr'){questionText=q.w[1];questionSub=''}
else{questionText=q.w[4];questionSub=''}
a.innerHTML=`
<div class="hdr"><h1>🧠 ${qMode==='jp2kr'?'일본어→한국어':'한국어→일본어'}</h1>
<p>맞힌 수: ${qScore}/${qTotal}</p></div>
<div class="qcard">
<div class="qword">${questionText}</div>
${quizPicked!==null?'<div class="wex" style="margin-top:12px;text-align:left"><div class="jp">'+q.w[1]+' ('+q.w[2]+')</div><div class="pr">'+q.w[3]+' — '+q.w[4]+'</div><div class="kr" style="margin-top:6px">'+q.w[5]+'</div><div class="pr">'+q.w[6]+'</div><div class="kr">'+q.w[7]+'</div></div>':''}
</div>
<div class="opts">${q.opts.map((o,i)=>{let cls='';if(quizPicked!==null){if(i===q.ans)cls='correct';else if(i===quizPicked)cls='wrong'}
return '<div class="opt '+cls+'" onclick="pickQ('+i+')">'+o+'</div>'}).join('')}</div>
${quizPicked!==null?'<button class="btn primary full" onclick="newQuiz();render()">다음 문제 ➡</button>':''}
<button class="btn ghost full" style="margin-top:8px" onclick="qMode=null;render()">← 모드 선택</button>`}

function startQuiz(mode){qMode=mode;qScore=0;qTotal=0;newQuiz();render()}
function newQuiz(){
let fw=filtered();if(fw.length<4)return;
let qi=Math.floor(Math.random()*fw.length),w=fw[qi];
let opts,ansField;
if(qMode==='jp2kr'){ansField=4;opts=[w[4]];
while(opts.length<4){let r=fw[Math.floor(Math.random()*fw.length)];if(!opts.includes(r[4]))opts.push(r[4])}}
else{ansField=1;opts=[w[1]];
while(opts.length<4){let r=fw[Math.floor(Math.random()*fw.length)];if(!opts.includes(r[1]))opts.push(r[1])}}
for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
quizQ={w:w,opts:opts,ans:opts.indexOf(qMode==='jp2kr'?w[4]:w[1])};quizPicked=null}

function pickQ(i){if(quizPicked!==null)return;quizPicked=i;qTotal++;
if(i===quizQ.ans){qScore++;learned.add(quizQ.w[0]);saveLearned();
let tk='jn4_today_'+new Date().toDateString();localStorage.setItem(tk,''+(parseInt(localStorage.getItem(tk)||'0')+1))}
render()}

function renderCheck(a){
// 그룹: 15개씩 (1-15, 16-30, ... 391-400)
let groups=[];
for(let i=0;i<400;i+=15){
let s=i+1,e=Math.min(i+15,400);
let catName=getCat(s);
let items=[];for(let j=s;j<=e;j++){let w=W.find(x=>x[0]===j);if(w)items.push(w)}
groups.push({start:s,end:e,cat:catName,items:items})}
let totalChecked=0,totalItems=0;
groups.forEach(g=>{g.items.forEach(w=>{totalItems++;if(checklist['c'+w[0]])totalChecked++})});
let pct=totalItems?Math.round(totalChecked/totalItems*100):0;
a.innerHTML=`
<div class="hdr"><h1>✅ 체크리스트</h1><p>학습 진도 체크 (${totalChecked}/${totalItems})</p></div>
<div class="pbar"><div class="row"><span>체크 진행률</span><b>${pct}%</b></div>
<div class="track"><div class="fill" style="width:${pct}%;background:linear-gradient(90deg,var(--orange),var(--yellow))"></div></div></div>
${groups.map(g=>{
let done=g.items.filter(w=>checklist['c'+w[0]]).length;
let gPct=g.items.length?Math.round(done/g.items.length*100):0;
return '<div class="clGroup"><h3>'+g.cat+' <span>#'+g.start+'~'+g.end+' ('+done+'/'+g.items.length+')</span></h3>'+
g.items.map(w=>{let ck=checklist['c'+w[0]];
return '<div class="clItem"><div class="clBox'+(ck?' checked':'')+'" onclick="toggleCL('+w[0]+')">✓</div>'+
'<div class="clLabel'+(ck?' checked':'')+'">'+w[1]+'</div>'+
'<div class="clRange">'+w[4]+'</div></div>'}).join('')+
'<div class="clPbar"><div class="f" style="width:'+gPct+'%"></div></div></div>'}).join('')}
<button class="btn ghost full" onclick="if(confirm('체크리스트 초기화?')){checklist={};saveCL();render()}" style="margin-top:8px;font-size:12px;opacity:.5">🔄 체크리스트 초기화</button>`}

function toggleCL(no){let k='c'+no;checklist[k]=!checklist[k];if(!checklist[k])delete checklist[k];saveCL();render()}

<select class="catSel" onchange="catFilter=+this.value;listLimit=50;render()">
<option value="0">전체 (1500개)</option>
${CATS.map(c=>'<option value="'+c[0]+'"'+(catFilter===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')}
</select></div>
<input class="search" placeholder="🔍 검색 (단어, 뜻, 발음)" value="${listSearch}" oninput="listSearch=this.value;listLimit=50;render()">
<div class="wlist">${showing.map(w=>{let d=learned.has(w[0]);
return '<div class="witem'+(d?' done':'')+'" onclick="openWord('+w[0]+')"><div class="wn">'+w[0]+'</div><div class="ww">'+w[1]+'</div><div class="wm">'+w[4]+'</div><div class="check">'+(d?'✓':'')+'</div></div>'}).join('')}
</div>
${fw.length>listLimit?'<div class="loadMore"><button onclick="listLimit+=50;render()">더 보기 ('+Math.min(listLimit,fw.length)+'/'+fw.length+')</button></div>':''}`}

function openWord(no){let w=W.find(x=>x[0]===no);if(!w)return;let isL=learned.has(no);
let m=document.createElement('div');m.className='modal';
m.innerHTML='<div class="inner"><div class="wcard showAll" style="margin-bottom:0;border:none">'+
'<div class="wnum">#'+w[0]+' · '+getCat(w[0])+'</div>'+
'<div class="wword">'+w[1]+'</div><div class="whira">'+w[2]+'</div><div class="wpron">'+w[3]+'</div>'+
'<div class="reveal"><div class="wmean">'+w[4]+'</div>'+
'<div class="wex"><div class="jp">'+w[5]+'</div><div class="pr">'+w[6]+'</div><div class="kr">'+w[7]+'</div></div></div>'+
'<div class="btns" style="margin-top:14px"><button class="btn '+(isL?'danger':'success')+'" onclick="toggleLearn('+no+');this.closest(`.modal`).remove()">'+(isL?'학습 취소':'학습 완료 ✅')+'</button>'+
'<button class="btn ghost" onclick="this.closest(`.modal`).remove()">닫기</button></div></div></div>';
m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m)}

function toggleLearn(no){if(learned.has(no))learned.delete(no);else learned.add(no);saveLearned();render()}
function resetAll(){if(confirm('학습 기록+체크리스트 모두 초기화?')){learned.clear();saveLearned();checklist={};saveCL();render()}}
render();
</script>
</body>
</html>
