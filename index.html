<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>JLPT N4 단어장 1500</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--pri:#e94560;--pri2:#ff6b6b;--acc:#0f3460;--txt:#e8e8e8;--txt2:#a0a0b0;--grn:#00d2a0;--ylw:#ffd166;--border:#2a2a4a;--blue:#4ea8de}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:70px;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:18px;background:linear-gradient(90deg,var(--pri),var(--ylw));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.header .sub{font-size:11px;color:var(--txt2);margin-top:2px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px 8px;text-align:center;font-size:10px;color:var(--txt2);border:none;background:none;cursor:pointer;transition:.2s}
.nav-btn.active{color:var(--pri)}
.nav-btn svg{display:block;margin:0 auto 3px;width:22px;height:22px}
.page{display:none;padding:12px}
.page.active{display:block}
.phase-label{font-size:13px;font-weight:700;color:var(--ylw);margin:14px 0 6px;padding-left:4px}
.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.day-card:active{transform:scale(.95)}
.day-card .dnum{font-size:15px;font-weight:700}
.day-card .drange{font-size:9px;color:var(--txt2);margin-top:2px}
.day-card .dprog{position:absolute;bottom:0;left:0;width:100%;height:3px;background:var(--border)}
.day-card .dprog .dfill{height:100%;background:var(--grn);transition:.3s}
.day-card.done{border-color:var(--grn)}.day-card.done .dnum{color:var(--grn)}
.day-card.current{border-color:var(--pri);box-shadow:0 0 8px rgba(233,69,96,.3)}
.total-prog{text-align:center;padding:14px;margin:8px 0;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.total-prog .tp-num{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--pri),var(--ylw));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.total-prog .tp-txt{font-size:12px;color:var(--txt2);margin-top:2px}
.prog-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--ylw));border-radius:3px;transition:.3s}
.tip-box{background:var(--card2);border-radius:10px;padding:12px;margin:10px 0;border-left:3px solid var(--ylw);font-size:12px;color:var(--txt2);line-height:1.6}
.tip-box b{color:var(--ylw)}
.study-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.back-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-size:13px;cursor:pointer}
.day-title{font-size:16px;font-weight:700}
.day-sub{font-size:12px;color:var(--txt2);text-align:center;margin-bottom:8px}
.study-tabs{display:flex;gap:4px;margin:6px 0}
.study-tabs button{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--txt2);font-size:12px;cursor:pointer;font-weight:500}
.study-tabs button.sel{border-color:var(--pri);background:rgba(233,69,96,.12);color:var(--pri)}
.word-card{background:var(--card);border-radius:14px;padding:20px;margin:8px 0;border:1px solid var(--border);position:relative;min-height:170px;cursor:pointer}
.word-card .wnum{position:absolute;top:10px;right:14px;font-size:11px;color:var(--txt2)}
.word-card .wjp{font-size:30px;font-weight:700;text-align:center;margin:10px 0 6px}
.word-card .whira{font-size:15px;color:var(--pri2);text-align:center}
.word-card .wpron{font-size:12px;color:var(--txt2);text-align:center;margin:2px 0}
.word-card .wmean{font-size:18px;font-weight:600;text-align:center;color:var(--ylw);margin:12px 0 8px}
.word-card .wex{background:var(--card2);border-radius:8px;padding:10px;margin-top:10px;font-size:13px;line-height:1.7}
.word-card .wex .jp{color:var(--txt)}.word-card .wex .pr{color:var(--txt2);font-size:11px}.word-card .wex .kr{color:var(--grn);font-size:12px;margin-top:2px}
.word-card .flip-hint{text-align:center;margin-top:14px;font-size:12px;color:var(--txt2)}
.word-nav{display:flex;gap:6px;margin:8px 0}
.word-nav button{flex:1;padding:11px;border:none;border-radius:8px;background:var(--acc);color:var(--txt);font-size:14px;font-weight:500;cursor:pointer}
.word-nav button:active{opacity:.7}
.word-nav button.pri{background:var(--pri)}
.gram-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:8px 0}
.gram-card .gp{font-size:20px;font-weight:700;color:var(--blue);margin-bottom:4px}
.gram-card .gm{font-size:13px;color:var(--ylw);margin-bottom:8px}
.gram-card .ge{background:var(--card2);border-radius:8px;padding:10px;font-size:13px;line-height:1.6}
.gram-card .ge .gj{color:var(--txt)}.gram-card .ge .gk{color:var(--grn);font-size:12px;margin-top:2px}
.quiz-setup{text-align:center;padding:20px 10px}
.quiz-setup h2{font-size:20px;margin-bottom:16px}
.quiz-opt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.quiz-opt button{padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--card);color:var(--txt);font-size:14px;cursor:pointer;transition:.2s}
.quiz-opt button.sel{border-color:var(--pri);background:rgba(233,69,96,.15)}
.quiz-opt button:active{transform:scale(.97)}
.quiz-start{margin-top:14px;padding:14px 40px;background:var(--pri);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.quiz-start:active{opacity:.8}
.quiz-q{text-align:center;padding:10px}
.quiz-q .qprog{font-size:12px;color:var(--txt2);margin-bottom:6px}
.quiz-q .qword{font-size:32px;font-weight:700;margin:14px 0;cursor:pointer}
.quiz-q .qscore{font-size:13px;color:var(--ylw)}
.quiz-choices{display:grid;gap:8px;margin:10px 0}
.quiz-choices button{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--txt);font-size:15px;cursor:pointer;text-align:left;transition:.15s}
.quiz-choices button.correct{background:#0a4a2e;border-color:var(--grn);color:var(--grn)}
.quiz-choices button.wrong{background:#4a0a0a;border-color:#ff4444;color:#ff4444}
.quiz-ex{background:var(--card2);border-radius:8px;padding:12px;margin:10px 0;font-size:13px;line-height:1.6;display:none}
.quiz-next{margin-top:10px;padding:12px 30px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;display:none}
.quiz-result{text-align:center;padding:30px 10px}
.quiz-result h2{font-size:24px;margin-bottom:10px}
.quiz-result .big{font-size:52px;font-weight:800;background:linear-gradient(90deg,var(--pri),var(--ylw));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
.range-sel{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0;justify-content:center}
.range-btn{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--txt);font-size:11px;cursor:pointer;transition:.15s}
.range-btn.sel{border-color:var(--pri);background:rgba(233,69,96,.15);color:var(--pri)}
.check-day{margin:6px 0}
.check-head{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border-radius:10px;cursor:pointer;border:1px solid var(--border)}
.check-head .ch-name{font-size:14px;font-weight:600}.check-head .ch-prog{font-size:12px;color:var(--grn)}
.check-body{display:none;padding:4px 0}.check-body.open{display:block}
.check-item{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid rgba(42,42,74,.4)}
.check-item label{flex:1;font-size:13px;margin-left:8px;display:flex;gap:6px;cursor:pointer}
.check-item label .ci-jp{font-weight:600}.check-item label .ci-kr{color:var(--txt2)}
.check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri);cursor:pointer}
.search-box{width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;outline:none;margin-bottom:10px}
.search-box:focus{border-color:var(--pri)}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card);border-radius:8px;margin:4px 0;cursor:pointer;border:1px solid var(--border)}
.list-item .li-jp{font-size:15px;font-weight:600}.list-item .li-kr{font-size:13px;color:var(--txt2)}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;padding:20px;overflow-y:auto}
.modal.show{display:flex;align-items:center;justify-content:center}
.modal-inner{background:var(--card);border-radius:14px;padding:24px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto}
.modal-close{display:block;margin:12px auto 0;padding:10px 30px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:none;border-radius:50%;background:rgba(78,168,222,.2);color:var(--blue);cursor:pointer;font-size:18px;transition:.2s;vertical-align:middle;margin-left:6px}
.speak-btn:active{transform:scale(.9);background:rgba(78,168,222,.4)}
.speak-btn.sm{width:28px;height:28px;font-size:14px}
.speak-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0}
</style>
</head>
<body>
<div class="header">
<h1>JLPT N4 완전정복 1500</h1>
<div class="sub">30일 완성 · 단어 1500 + 문법 90 · 퀴즈 · 체크리스트</div>
</div>

<div id="p-home" class="page active">
<div class="total-prog">
<div class="tp-num" id="home-prog">0%</div>
<div class="tp-txt">전체 학습 진행률</div>
<div class="prog-bar"><div class="fill" id="home-bar" style="width:0%"></div></div>
</div>
<div class="tip-box">
<b>💡 30일 플랜:</b> 매일 단어 50개 + 문법 3개! 오늘의 일차를 눌러 시작하세요.<br>
📘 1~10일 기초 → 📗 11~20일 확장 → 📙 21~27일 심화 → 📕 28~30일 복습
</div>
<div id="day-container"></div>
</div>

<div id="p-study" class="page">
<div class="study-header">
<button class="back-btn" onclick="showPage('home')">← 홈</button>
<span class="day-title" id="study-title"></span>
<span id="study-counter" style="font-size:12px;color:var(--txt2)"></span>
</div>
<div class="day-sub" id="study-range"></div>
<div class="study-tabs">
<button id="st-card" class="sel" onclick="setTab('card')">📇 카드학습</button>
<button id="st-list" onclick="setTab('list')">📋 단어목록</button>
<button id="st-gram" onclick="setTab('gram')">📝 문법</button>
</div>
<div id="study-area"></div>
</div>

<div id="p-quiz" class="page">
<div id="quiz-setup" class="quiz-setup">
<h2>🎯 퀴즈</h2>
<p style="color:var(--txt2);font-size:13px;margin-bottom:10px">모드 선택</p>
<div class="quiz-opt">
<button id="qm-jp2kr" class="sel" onclick="setQMode('jp2kr')">日→한</button>
<button id="qm-kr2jp" onclick="setQMode('kr2jp')">한→日</button>
</div>
<p style="color:var(--txt2);font-size:13px;margin:10px 0 6px">일차 선택</p>
<div class="range-sel" id="quiz-range"></div>
<p style="color:var(--txt2);font-size:13px;margin:10px 0 6px">문제 수</p>
<div class="quiz-opt">
<button id="qn-10" class="sel" onclick="setQNum(10)">10문제</button>
<button id="qn-20" onclick="setQNum(20)">20문제</button>
<button id="qn-30" onclick="setQNum(30)">30문제</button>
<button id="qn-50" onclick="setQNum(50)">50문제</button>
</div>
<button class="quiz-start" onclick="startQuiz()">퀴즈 시작!</button>
</div>
<div id="quiz-play" style="display:none">
<div class="quiz-q"><div class="qprog" id="q-prog"></div><div class="qscore" id="q-score"></div><div class="qword" id="q-word"></div></div>
<div class="quiz-choices" id="q-choices"></div>
<div class="quiz-ex" id="q-ex"></div>
<button class="quiz-next" id="q-next" onclick="nextQ()">다음 문제 →</button>
</div>
<div id="quiz-result" class="quiz-result" style="display:none"></div>
</div>

<div id="p-check" class="page">
<div class="total-prog">
<div class="tp-num" id="check-prog">0%</div>
<div class="tp-txt">체크리스트 진행률</div>
<div class="prog-bar"><div class="fill" id="check-bar" style="width:0%"></div></div>
</div>
<div style="text-align:right;margin-bottom:8px">
<button onclick="resetCheck()" style="padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--pri);font-size:12px;cursor:pointer">초기화</button>
</div>
<div id="check-list"></div>
</div>

<div id="p-list" class="page">
<input class="search-box" id="search-input" placeholder="🔍 단어 검색 (일본어/한국어/발음)" oninput="searchWords()">
<div id="word-list"></div>
</div>

<div class="modal" id="word-modal"><div class="modal-inner" id="modal-content"></div></div>

<nav class="nav">
<button class="nav-btn active" data-page="home" onclick="showPage('home')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>홈
</button>
<button class="nav-btn" data-page="quiz" onclick="showPage('quiz')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>퀴즈
</button>
<button class="nav-btn" data-page="check" onclick="showPage('check')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>체크
</button>
<button class="nav-btn" data-page="list" onclick="showPage('list')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>목록
</button>

<script>

function showPage(p){
  document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active')});
  document.getElementById('p-'+p).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.page===p)});
  if(p==='home')renderHome();
  if(p==='check')renderCheck();
  if(p==='list')renderList();
  if(p==='quiz')resetQuizUI();
}

function countChecked(s,e){var c=0;for(var i=s;i<=e;i++)if(checked[i])c++;return c;}

function renderHome(){
  var total=countAllChecked();
  var pct=Math.round(total/TOTAL_ITEMS*100);
  document.getElementById('home-prog').textContent=pct+'%';
  document.getElementById('home-bar').style.width=pct+'%';
  var c=document.getElementById('day-container');
  c.innerHTML='';
  var phases=[[1,10,'📘 기초 단어 (1~10일차)'],[11,20,'📗 확장 어휘 (11~20일차)'],[21,27,'📙 심화 표현 (21~27일차)'],[28,30,'📕 최종 복습 (28~30일차)']];
  phases.forEach(function(ph){
    var ps=ph[0],pe=ph[1],label=ph[2];
    var pl=document.createElement('div');pl.className='phase-label';pl.textContent=label;c.appendChild(pl);
    var grid=document.createElement('div');grid.className='day-grid';
    for(var d=ps;d<=pe;d++){
      var day=DAYS[d-1],s=day[1],e=day[2];
      var cnt=e-s+1,done=countChecked(s,e);
      var gs=getDayGram(d-1);var gd=countDayGramChecked(d-1);
      var totalDay=cnt+gs.length,doneDay=done+gd;
      var dpct=Math.round(doneDay/totalDay*100);
      var card=document.createElement('div');
      card.className='day-card'+(dpct>=100?' done':'')+(dpct>0&&dpct<100?' current':'');
      card.innerHTML='<div class="dnum">'+d+'일</div><div class="drange">'+doneDay+'/'+totalDay+'</div><div class="dprog"><div class="dfill" style="width:'+dpct+'%"></div></div>';
      card.setAttribute('data-day',d-1);
      card.onclick=function(){openStudy(parseInt(this.getAttribute('data-day')))};
      grid.appendChild(card);
    }
    c.appendChild(grid);
  });
}

function getDayWords(di){var d=DAYS[di],s=d[1],e=d[2];return W.filter(function(w){return w[0]>=s&&w[0]<=e});}
function getDayGram(di){var dayNum=di+1;var g=GRAM.find(function(x){return x[0]===dayNum});return g?g[1]:[];}

  document.getElementById('study-range').textContent='#'+d[1]+' ~ #'+d[2]+' (50단어 + 문법 3개)';
  document.getElementById('st-card').classList.add('sel');
  document.getElementById('st-list').classList.remove('sel');
  document.getElementById('st-gram').classList.remove('sel');
  renderStudy();
}

function setTab(t){
  curTab=t;
  document.getElementById('st-card').classList.toggle('sel',t==='card');
  document.getElementById('st-list').classList.toggle('sel',t==='list');
  document.getElementById('st-gram').classList.toggle('sel',t==='gram');
  renderStudy();
}

function renderStudy(){
  if(curTab==='card')renderCard();
  else if(curTab==='list')renderStudyList();
  else renderGrammar();
}

function renderCard(){
  var ws=getDayWords(curDay),w=ws[curIdx];
  document.getElementById('study-counter').textContent=(curIdx+1)+'/'+ws.length;
  var area=document.getElementById('study-area');
  var speakBtn='<button class="speak-btn" onclick="event.stopPropagation();speak(\''+w[1].replace(/'/g,"\\'")+'\')">🔊</button>';
  var speakEx='<button class="speak-btn sm" onclick="event.stopPropagation();speak(\''+w[5].replace(/'/g,"\\'")+'\')">🔊</button>';
  if(!flipped){
    area.innerHTML='<div class="word-card" onclick="studyFlip()"><div class="wnum">#'+w[0]+'</div><div class="speak-row"><span class="wjp" style="margin:0">'+w[1]+'</span>'+speakBtn+'</div><div class="whira">'+w[2]+'</div><div class="wpron">'+w[3]+'</div><div class="flip-hint">탭하여 뜻 보기 👆</div></div><div class="word-nav"><button onclick="studyPrev()">← 이전</button><button class="pri" onclick="studyFlip()">뒤집기</button><button onclick="studyNext()">다음 →</button></div>';
  } else {
    area.innerHTML='<div class="word-card" onclick="studyFlip()"><div class="wnum">#'+w[0]+'</div><div class="speak-row"><span class="wjp" style="margin:0">'+w[1]+'</span>'+speakBtn+'</div><div class="whira">'+w[2]+'</div><div class="wpron">'+w[3]+'</div><div class="wmean">'+w[4]+'</div><div class="wex"><div class="jp">'+w[5]+' '+speakEx+'</div><div style="font-size:11px;color:var(--pri2);margin:2px 0">'+w[8]+'</div><div class="pr">'+w[6]+'</div><div class="kr">'+w[7]+'</div></div></div><div class="word-nav"><button onclick="studyPrev()">← 이전</button><button class="pri" onclick="studyFlip()">뒤집기</button><button onclick="studyNext()">다음 →</button></div>';
  }
}
function studyPrev(){if(curIdx>0){curIdx--;flipped=false;renderCard()}}
function studyNext(){var ws=getDayWords(curDay);if(curIdx<ws.length-1){curIdx++;flipped=false;renderCard()}}
function studyFlip(){flipped=!flipped;renderCard()}

function renderStudyList(){
  var ws=getDayWords(curDay);
  document.getElementById('study-counter').textContent=ws.length+'개';
  var h='';
  ws.forEach(function(w){
    h+='<div class="list-item" onclick="showWordModal('+w[0]+')"><span class="li-jp">'+w[1]+' <small style="color:var(--txt2)">'+w[2]+'</small></span><span class="li-kr">'+w[4]+'</span></div>';
  });
  document.getElementById('study-area').innerHTML=h;
}

function renderGrammar(){
  var gs=getDayGram(curDay);
  document.getElementById('study-counter').textContent=gs.length+'개';
  var h='<div style="margin-bottom:8px;font-size:13px;color:var(--ylw);text-align:center">📝 '+(curDay+1)+'일차 문법 패턴</div>';
  if(gs.length===0){h+='<p style="text-align:center;color:var(--txt2)">이 일차의 문법 데이터가 없습니다.</p>';}
  gs.forEach(function(g){
    var gsb='<button class="speak-btn sm" onclick="speak(\''+g[2].replace(/'/g,"\\'")+'\')">🔊</button>';
    h+='<div class="gram-card"><div class="gp">'+g[0]+'</div><div class="gm">'+g[1]+'</div><div class="ge"><div class="gj">'+g[2]+' '+gsb+'</div><div class="gh" style="font-size:11px;color:var(--pri2);margin:3px 0">'+g[3]+'</div><div class="gpr" style="font-size:11px;color:var(--txt2);margin:1px 0">'+g[4]+'</div><div class="gk">'+g[5]+'</div></div></div>';
  });
  document.getElementById('study-area').innerHTML=h;
}

// QUIZ
function resetQuizUI(){
  document.getElementById('quiz-setup').style.display='block';
  document.getElementById('quiz-play').style.display='none';
  document.getElementById('quiz-result').style.display='none';
  var rc=document.getElementById('quiz-range');rc.innerHTML='';
  var ab=document.createElement('button');ab.className='range-btn'+(qDays.has('all')?' sel':'');ab.textContent='전체';
  ab.onclick=function(){qDays=new Set(['all']);resetQuizUI()};rc.appendChild(ab);
  for(var d=1;d<=30;d++){
    var b=document.createElement('button');b.className='range-btn'+(qDays.has(d)?' sel':'');b.textContent=d+'일';
    b.setAttribute('data-d',d);
    b.onclick=function(){var dd=parseInt(this.getAttribute('data-d'));qDays.delete('all');if(qDays.has(dd))qDays.delete(dd);else qDays.add(dd);if(!qDays.size)qDays.add('all');resetQuizUI()};
    rc.appendChild(b);
  }
}
function setQMode(m){qMode=m;document.getElementById('qm-jp2kr').classList.toggle('sel',m==='jp2kr');document.getElementById('qm-kr2jp').classList.toggle('sel',m==='kr2jp')}
function setQNum(n){qNum=n;[10,20,30,50].forEach(function(v){document.getElementById('qn-'+v).classList.toggle('sel',v===n)})}

function startQuiz(){
  var pool=W;
  if(!qDays.has('all')){
    pool=[];
    qDays.forEach(function(d){var day=DAYS[d-1];pool=pool.concat(W.filter(function(w){return w[0]>=day[1]&&w[0]<=day[2]}))});
  }
  pool=pool.slice().sort(function(){return Math.random()-.5});
  qList=pool.slice(0,Math.min(qNum,pool.length));
  qIdx=0;qScore=0;qAnswered=false;
  document.getElementById('quiz-setup').style.display='none';
  document.getElementById('quiz-play').style.display='block';
  document.getElementById('quiz-result').style.display='none';
  renderQ();
}
function renderQ(){
  if(qIdx>=qList.length){showResult();return}
  var w=qList[qIdx];qAnswered=false;
  document.getElementById('q-prog').textContent=(qIdx+1)+' / '+qList.length;
  document.getElementById('q-score').textContent='✅ '+qScore+'점';
  document.getElementById('q-word').textContent=qMode==='jp2kr'?w[1]:w[4];
  document.getElementById('q-word').onclick=function(){speak(qMode==='jp2kr'?w[1]:w[5])};
  var qHira=qMode==='jp2kr'?'<div style="font-size:14px;color:var(--pri2);margin-top:6px">'+w[2]+'</div><div style="font-size:11px;color:var(--txt2)">'+w[3]+'</div>':'';
  document.getElementById('q-word').innerHTML=(qMode==='jp2kr'?w[1]:w[4])+' <button class="speak-btn sm" onclick="event.stopPropagation();speak(\''+((qMode==='jp2kr'?w[1]:w[5]).replace(/'/g,"\\'"))+'\')">🔊</button>'+qHira;
  document.getElementById('q-ex').style.display='none';
  document.getElementById('q-next').style.display='none';
  var correct=qMode==='jp2kr'?w[4]:w[1];
  var others=W.filter(function(x){return x[0]!==w[0]}).sort(function(){return Math.random()-.5}).slice(0,3).map(function(x){return qMode==='jp2kr'?x[4]:x[1]});
  var choices=[correct].concat(others).sort(function(){return Math.random()-.5});
  var cc=document.getElementById('q-choices');cc.innerHTML='';
  choices.forEach(function(ch){
    var b=document.createElement('button');b.textContent=ch;
    b.onclick=function(){answerQ(this,ch,correct,w)};
    cc.appendChild(b);
  });
}
function answerQ(btn,chosen,correct,w){
  if(qAnswered)return;qAnswered=true;
  if(chosen===correct){qScore++;toggleCheck(w[0],true);}
  var btns=document.querySelectorAll('#q-choices button');
  for(var i=0;i<btns.length;i++){
    if(btns[i].textContent===correct)btns[i].classList.add('correct');
    if(btns[i].textContent===chosen&&chosen!==correct)btns[i].classList.add('wrong');
    btns[i].style.pointerEvents='none';
  }
  var ex=document.getElementById('q-ex');
  var qsb='<button class="speak-btn sm" onclick="speak(\''+w[1].replace(/'/g,"\\'")+'\')">🔊</button>';
  var qse='<button class="speak-btn sm" onclick="speak(\''+w[5].replace(/'/g,"\\'")+'\')">🔊</button>';
  ex.innerHTML='<div style="font-size:16px;font-weight:700;margin-bottom:4px">'+w[1]+' '+qsb+'</div><div style="font-size:13px;color:var(--pri2)">'+w[2]+'</div><div style="font-size:11px;color:var(--txt2)">'+w[3]+'</div><div style="font-size:13px;color:var(--ylw);margin:4px 0">'+w[4]+'</div><div style="border-top:1px solid var(--border);margin:8px 0;padding-top:8px"><div style="color:var(--txt);font-size:13px">'+w[5]+' '+qse+'</div><div style="font-size:11px;color:var(--pri2);margin:2px 0">'+w[8]+'</div><div style="font-size:11px;color:var(--txt2);margin:2px 0">'+w[6]+'</div><div style="font-size:12px;color:var(--grn)">'+w[7]+'</div></div>';
  ex.style.display='block';
  document.getElementById('q-next').style.display='block';
}
function nextQ(){qIdx++;renderQ()}
function showResult(){
  document.getElementById('quiz-play').style.display='none';
  var r=document.getElementById('quiz-result');
  var pct=Math.round(qScore/qList.length*100);
  var emoji=pct>=90?'🎉':pct>=70?'👍':pct>=50?'💪':'📖';
  var msg=pct>=90?'완벽해요! N4 합격 가자!':pct>=70?'잘했어요! 조금만 더!':pct>=50?'괜찮아요, 복습하면 됩니다!':'이 범위를 다시 공부해보세요!';
  r.innerHTML='<h2>'+emoji+' 퀴즈 결과</h2><div class="big">'+pct+'%</div><p style="font-size:16px">'+qScore+' / '+qList.length+' 정답</p><p style="color:var(--txt2);margin:8px 0">'+msg+'</p><button class="quiz-start" onclick="showPage(\'quiz\')">다시 하기</button>';
  r.style.display='block';
}

// CHECK
var TOTAL_ITEMS=1590; // 1500 words + 90 grammar
function countAllChecked(){
  var c=0;
  for(var k in checked)if(checked[k])c++;
  return c;
}
function countDayGramChecked(d){
  var gs=getDayGram(d);var c=0;
  for(var i=0;i<gs.length;i++)if(checked['g'+(d+1)+'_'+i])c++;
  return c;
}
function renderCheck(){
  var total=countAllChecked();
  var pct=Math.round(total/TOTAL_ITEMS*100);
  document.getElementById('check-prog').textContent=pct+'%';
  document.getElementById('check-bar').style.width=pct+'%';
  var cl=document.getElementById('check-list');cl.innerHTML='';
  DAYS.forEach(function(day){
    var d=day[0],s=day[1],e=day[2],cnt=e-s+1;
    var ws=W.filter(function(w){return w[0]>=s&&w[0]<=e});
    var gs=getDayGram(d-1);
    var totalDay=cnt+gs.length;
    var doneWords=countChecked(s,e);
    var doneGram=countDayGramChecked(d-1);
    var doneTotal=doneWords+doneGram;
    var grp=document.createElement('div');grp.className='check-day';
    var items='';
    // 단어 헤더
    items+='<div style="padding:6px 12px;font-size:11px;color:var(--ylw);font-weight:600;background:var(--card2);border-radius:4px;margin:4px 0">📚 단어 ('+doneWords+'/'+cnt+')</div>';
    ws.forEach(function(w){
      items+='<div class="check-item"><input type="checkbox" id="ck'+w[0]+'" '+(checked[w[0]]?'checked':'')+' onchange="toggleCheck('+w[0]+',this.checked)"><label for="ck'+w[0]+'"><span class="ci-jp">'+w[1]+'</span><span class="ci-kr">'+w[4]+'</span></label></div>';
    });
    // 문법 헤더
    if(gs.length>0){
      items+='<div style="padding:6px 12px;font-size:11px;color:var(--blue);font-weight:600;background:var(--card2);border-radius:4px;margin:6px 0 4px">📝 문법 ('+doneGram+'/'+gs.length+')</div>';
      gs.forEach(function(g,gi){
        var gkey='g'+d+'_'+gi;
        items+='<div class="check-item"><input type="checkbox" id="ck_'+gkey+'" '+(checked[gkey]?'checked':'')+' onchange="toggleCheck(\''+gkey+'\',this.checked)"><label for="ck_'+gkey+'"><span class="ci-jp" style="color:var(--blue)">'+g[0]+'</span><span class="ci-kr">'+g[1]+'</span></label></div>';
      });
    }
    grp.innerHTML='<div class="check-head" onclick="this.nextElementSibling.classList.toggle(\'open\')"><span class="ch-name">'+d+'일차</span><span class="ch-prog">'+doneTotal+'/'+totalDay+'</span></div><div class="check-body">'+items+'</div>';
    cl.appendChild(grp);
  });
}
function toggleCheck(key,val){
  if(val)checked[key]=1;else delete checked[key];
  localStorage.setItem('n4v3',JSON.stringify(checked));
  var total=countAllChecked();
  var pct=Math.round(total/TOTAL_ITEMS*100);
  var cp=document.getElementById('check-prog');
  var cb=document.getElementById('check-bar');
  if(cp){cp.textContent=pct+'%';}
  if(cb){cb.style.width=pct+'%';}
}
function resetCheck(){if(confirm('체크리스트를 초기화할까요?')){checked={};localStorage.setItem('n4v3','{}');renderCheck();renderHome()}}

// LIST
function renderList(filter){
  filter=filter||'';
  var c=document.getElementById('word-list');c.innerHTML='';
  var f=filter.toLowerCase();
  var filtered=f?W.filter(function(w){return w[1].indexOf(f)>=0||w[2].indexOf(f)>=0||w[4].indexOf(f)>=0||w[3].indexOf(f)>=0}):W.slice(0,100);
  if(!f)c.innerHTML='<p style="font-size:12px;color:var(--txt2);text-align:center;margin:8px 0">검색어를 입력하세요 (처음 100개 표시 중)</p>';
  filtered.forEach(function(w){
    var d=document.createElement('div');d.className='list-item';
    d.innerHTML='<span class="li-jp">'+w[1]+' <small style="color:var(--txt2)">'+w[2]+'</small></span><span class="li-kr">'+w[4]+'</span>';
    d.setAttribute('data-n',w[0]);
    d.onclick=function(){showWordModal(parseInt(this.getAttribute('data-n')))};
    c.appendChild(d);
  });
  if(f&&!filtered.length)c.innerHTML='<p style="text-align:center;color:var(--txt2);margin:20px">결과 없음</p>';
}
function searchWords(){renderList(document.getElementById('search-input').value)}

function showWordModal(num){
  var w=W.find(function(x){return x[0]===num});
  if(!w)return;
  var m=document.getElementById('word-modal');
  var sb='<button class="speak-btn" onclick="event.stopPropagation();speak(\''+w[1].replace(/'/g,"\\'")+'\')">🔊</button>';
  var se='<button class="speak-btn sm" onclick="event.stopPropagation();speak(\''+w[5].replace(/'/g,"\\'")+'\')">🔊</button>';
  document.getElementById('modal-content').innerHTML='<div class="word-card" style="border:none;margin:0;cursor:default"><div class="wnum">#'+w[0]+'</div><div class="speak-row"><span class="wjp" style="margin:0">'+w[1]+'</span>'+sb+'</div><div class="whira">'+w[2]+'</div><div class="wpron">'+w[3]+'</div><div class="wmean">'+w[4]+'</div><div class="wex"><div class="jp">'+w[5]+' '+se+'</div><div style="font-size:11px;color:var(--pri2);margin:2px 0">'+w[8]+'</div><div class="pr">'+w[6]+'</div><div class="kr">'+w[7]+'</div></div></div><button class="modal-close" onclick="document.getElementById(\'word-modal\').classList.remove(\'show\')">닫기</button>';
  m.classList.add('show');
}
document.getElementById('word-modal').onclick=function(e){if(e.target===this)this.classList.remove('show')};

var _jpVoice=null;
function _loadVoices(){
  var v=window.speechSynthesis.getVoices();
  // 우선순위: Enhanced/Premium JP > 일반 JP
  var pref=['Kyoko','O-Ren','Otoya','Hattori','Google 日本語','Microsoft Nanami','Haruka'];
  for(var p=0;p<pref.length;p++){
    for(var i=0;i<v.length;i++){
      if(v[i].name.indexOf(pref[p])>=0){_jpVoice=v[i];return}
    }
  }
  // Fallback: any ja voice
  for(var i=0;i<v.length;i++){
    if(v[i].lang&&v[i].lang.indexOf('ja')>=0){_jpVoice=v[i];return}
  }
}
function speak(text){
  if(!('speechSynthesis' in window)){alert('이 브라우저는 음성을 지원하지 않습니다.');return}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=0.82;u.pitch=1.05;u.volume=1;
  if(!_jpVoice)_loadVoices();
  if(_jpVoice)u.voice=_jpVoice;
  window.speechSynthesis.speak(u);
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=_loadVoices;
  _loadVoices();
}

renderHome();
</script></body></html>
